name: Update contribution workshop

on:
  schedule:
    # 03:37 Malaysia time (UTC+8), outside the other profile update slots.
    - cron: "37 19 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/robot-builder.yml"
      - "scripts/**"
      - "tests/**"

permissions:
  contents: read

concurrency:
  group: contribution-workshop
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout profile
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install renderer dependency
        run: python -m pip install --disable-pip-version-check -r scripts/requirements.txt

      - name: Test data handling and animation
        run: python -m unittest discover -s tests -v

      - name: Render actual contribution calendar
        run: python scripts/generate_robot_builder.py --username "$GITHUB_REPOSITORY_OWNER"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/robot-builder.gif assets/robot-builder.png
          if git diff --cached --quiet; then
            echo "Contribution images are already current."
            exit 0
          fi
          git commit -m "Update contribution workshop [skip ci]"
          for attempt in 1 2 3; do
            if ! git pull --rebase origin "$GITHUB_REF_NAME"; then
              git rebase --abort || true
              echo "Stopped publishing to preserve concurrent changes."
              exit 1
            fi
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            sleep 2
          done
          echo "Could not publish images after three attempts."
          exit 1
