<svg xmlns="http://www.w3.org/2000/svg" width="600" height="560" viewBox="0 0 600 560" role="img"><title>Research concept — semi-supervised 3D medical image segmentation</title><style>
      @keyframes volumeFloat { 0%,100% { transform:translateY(0) } 50% { transform:translateY(-6px) } }
      @keyframes documentFloat { 0%,100% { transform:translateY(0) } 50% { transform:translateY(3px) } }
      @keyframes maskPulse { 0%,100% { opacity:.72 } 50% { opacity:1 } }
      @keyframes researchScan { 0%,100% { transform:translateY(-7px);opacity:.25 } 50% { transform:translateY(7px);opacity:.85 } }
      .volume-motion { animation:volumeFloat 4.8s ease-in-out infinite }
      .document-motion { animation:documentFloat 4.8s ease-in-out infinite }
      .mask-motion { animation:maskPulse 4.8s ease-in-out infinite }
      .scan-motion { animation:researchScan 4.8s ease-in-out infinite }
      @media (prefers-reduced-motion:reduce) {
        .volume-motion,.document-motion,.mask-motion,.scan-motion { animation:none!important }
        .flow-signal,.scan-motion { display:none }
      }
    </style><rect width="600" height="560" fill="#10171c" /><g font-family="Segoe UI,Arial,sans-serif"><text x="300" y="35" text-anchor="middle" fill="#9aa7b7" font-size="20">3D medical images</text><g transform="translate(225 57)"><path d="M0 27L75 0L150 27V90L75 120L0 90Z" fill="#17252c" stroke="#8b9ea7" stroke-width="2" /><path d="M0 27L75 55L150 27M75 55V120M0 49L75 77L150 49M0 71L75 99L150 71" fill="none" stroke="#5b737c" stroke-width="2" /><path d="M37 40L75 26L112 40L75 55Z" fill="#c3d0d4" /><g class="scan-motion"><path d="M5 49L75 75L145 49" stroke="#7ee787" stroke-width="2" fill="none" /></g></g><path d="M300 185V222M294 216L300 222L306 216" fill="none" stroke="#56d364" stroke-width="2" /><rect x="65" y="237" width="470" height="102" rx="7" fill="#13251b" stroke="#436e50" stroke-width="2" /><text x="300" y="278" text-anchor="middle" fill="#e6edf3" font-size="28" font-weight="600">SAM + semi-supervision</text><text x="300" y="315" text-anchor="middle" fill="#a5bead" font-size="23">foundation models · limited labels</text><path d="M300 352V389M294 383L300 389L306 383" fill="none" stroke="#56d364" stroke-width="2" /><g transform="translate(225 402)"><path d="M0 27L75 0L150 27V90L75 120L0 90Z" fill="#172b20" stroke="#6ea27b" stroke-width="2" /><path d="M0 27L75 55L150 27M75 55V120M0 49L75 77L150 49M0 71L75 99L150 71" fill="none" stroke="#456e51" stroke-width="2" /><path d="M37 40L75 26L112 40L75 55Z" fill="#7ee787" class="mask-motion" /><path d="M37 40V84L75 99V55Z" fill="#40b85c" class="mask-motion" /><path d="M75 55L112 40V84L75 99Z" fill="#289642" class="mask-motion" /></g><text x="300" y="550" text-anchor="middle" fill="#9aa7b7" font-size="20">Segmentation · research concept</text></g><circle class="flow-signal" r="4" fill="#7ee787"><animateMotion dur="4.8s" repeatCount="indefinite" path="M300 185V222" begin="-2.4s" /><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.8;1" dur="4.8s" repeatCount="indefinite" begin="-2.4s" /></circle><circle class="flow-signal" r="4" fill="#7ee787"><animateMotion dur="4.8s" repeatCount="indefinite" path="M300 352V389" begin="0s" /><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.8;1" dur="4.8s" repeatCount="indefinite" begin="0s" /></circle></svg>
