<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img">
<title>Nigel Cheong — AI and machine learning</title><style>
      @keyframes volumeFloat { 0%,100% { transform:translateY(0) } 50% { transform:translateY(-6px) } }
      @keyframes documentFloat { 0%,100% { transform:translateY(0) } 50% { transform:translateY(3px) } }
      @keyframes maskPulse { 0%,100% { opacity:.72 } 50% { opacity:1 } }
      @keyframes researchScan { 0%,100% { transform:translateY(-7px);opacity:.25 } 50% { transform:translateY(7px);opacity:.85 } }
      .volume-motion { animation:volumeFloat 4.8s ease-in-out infinite }
      .document-motion { animation:documentFloat 4.8s ease-in-out infinite }
      .mask-motion { animation:maskPulse 4.8s ease-in-out infinite }
      .scan-motion { animation:researchScan 4.8s ease-in-out infinite }
      @media (prefers-reduced-motion:reduce) {
        .volume-motion,.document-motion,.mask-motion,.scan-motion { animation:none!important }
        .flow-signal,.scan-motion { display:none }
      }
