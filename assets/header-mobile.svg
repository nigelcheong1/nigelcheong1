<svg xmlns="http://www.w3.org/2000/svg" width="600" height="280" viewBox="0 0 600 280" role="img"><title>Nigel Cheong — AI and machine learning</title><style>
      @keyframes volumeFloat { 0%,100% { transform:translateY(0) } 50% { transform:translateY(-6px) } }
      @keyframes documentFloat { 0%,100% { transform:translateY(0) } 50% { transform:translateY(3px) } }
      @keyframes maskPulse { 0%,100% { opacity:.72 } 50% { opacity:1 } }
      @keyframes researchScan { 0%,100% { transform:translateY(-7px);opacity:.25 } 50% { transform:translateY(7px);opacity:.85 } }
      .volume-motion { animation:volumeFloat 4.8s ease-in-out infinite }
      .document-motion { animation:documentFloat 4.8s ease-in-out infinite }
      .mask-motion { animation:maskPulse 4.8s ease-in-out infinite }
      .scan-motion { animation:researchScan 4.8s ease-in-out infinite }
      @media (prefers-reduced-motion:reduce) {
        .volume-motion,.document-motion,.mask-motion,.scan-motion { animation:none!important }
        .flow-signal,.scan-motion { display:none }
      }
    </style><rect width="600" height="280" fill="#0d1117" /><g font-family="Segoe UI,Arial,sans-serif"><text x="12" y="86" font-size="62" font-weight="700" letter-spacing="-2" fill="#f0f6fc">Nigel <tspan fill="#7ee787">Cheong</tspan></text><text x="15" y="132" font-size="26" fill="#e6edf3">AI &amp; machine learning</text><text x="15" y="185" font-size="24" fill="#a4afbd">From research</text><text x="15" y="219" font-size="24" fill="#a4afbd">to working systems.</text><g class="volume-motion"><g transform="translate(408 122)"><path d="M0 35L75 0L150 35L75 70Z" fill="#d5e3dc" stroke="#0d1117" stroke-width="2" /><path d="M0 35V77L75 112V70Z" fill="#9db4a6" /><path d="M75 70L150 35V77L75 112Z" fill="#607b69" /><path d="M0 49L75 84L150 49M0 63L75 98L150 63" fill="none" stroke="#0d1117" stroke-width="3" /><path d="M33 35L75 15L117 35L75 55Z" fill="#56d364" stroke="#238636" stroke-width="2" /></g></g></g></svg>
